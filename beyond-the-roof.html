      '<main id="main-content"><section class="btr-hero"><div class="btr-wrap"><p style="margin:0;font-weight:700;letter-spacing:.13em;text-transform:uppercase;font-size:.8rem">More to the story</p><h1>Beyond the Roof</h1><p>There is more to a business than the work itself: the people behind it, the experiences that shape us, and the connections we make along the way.</p></div></section>'+

      '<section class="btr-card" id="about"><h2>About Nik\'s</h2><p>Nik\'s Remodeling serves West Georgia and East Alabama with projects, installation, materials, and ideas for making a house feel more like home. Our promise is simple: Everything Under the Roof.</p></section>'+

      '<section class="btr-card" id="community"><h2>Community Circle</h2><p>People and projects we actively learn from, work with, or trust to bring real value.</p><div class="btr-feature"><p style="font-size:.75rem;font-weight:700;letter-spacing:.09em;margin:0 0 5px;text-transform:uppercase;color:#586573">First featured connection</p><h3>Ocoee Studios</h3><p>Meet Jamie and discover Ocoee Studios, an independent creative studio developing practical ideas, including STRUK for contractors.</p><div class="btr-links"><a class="btr-link" href="https://ocoeestudios.com/" target="_blank" rel="noopener noreferrer">Visit Ocoee Studios</a><a class="btr-link" href="https://ocoeestudios.com/product/struk" target="_blank" rel="noopener noreferrer">Explore STRUK</a></div></div><p class="btr-disclosure">Featured people, businesses, and projects are independent of Nik\'s Remodeling unless otherwise stated.</p></section>'+
