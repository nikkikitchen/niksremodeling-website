name: Daily supplier inventory
on:
  schedule:
    - cron: '12 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-inventory
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check warehouse stock and archive 30-day zero items
        run: python scripts/daily_inventory_audit.py
      - name: Commit inventory history if changed
        run: |
          git config user.name "niks-inventory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory-status.json
          if ! git diff --staged --quiet; then
            git commit -m "Daily supplier stock history"
            git push
          fi
