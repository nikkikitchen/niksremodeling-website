name: Verify Nik's Remodeling site build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript, catalog and package integrity
        run: npm run build
      - name: Run site tests
        run: npm test
      - name: Run calculator audit
        run: npm run test:calculator
      - name: Check live Cloudflare checkout release (read-only, non-blocking)
        run: node scripts/check-live-checkout.mjs
        continue-on-error: true
      - name: Upload exact publishable dist files
        uses: actions/upload-artifact@v4
        with:
          name: niksremodeling-dist
          path: dist/
          if-no-files-found: error
