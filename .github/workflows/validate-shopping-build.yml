name: Validate shopping build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test shopping and calculators
        run: npm test
      - name: Audit calculator paths
        run: npm run test:calculator
      - name: Build publishable site
        run: npm run build
      - name: Verify published artifact
        run: npm run verify:dist
