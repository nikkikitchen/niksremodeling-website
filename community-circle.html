<body data-page="beyond-roof"><script src="/app.js?v=20261120-unified-nav3"></script><script>document.body.insertAdjacentHTML('afterbegin',header()+'<main id="main-content"><section class="btr-hero"><div class="btr-wrap"><h1>Community Circle</h1><p>People and projects we actively learn from, work with, or trust to bring real value.</p></div></section><div class="btr-main"><div class="btr-wrap"><a class="btr-back" href="/beyond-the-roof.html">← Beyond the Roof</a><p class="btr-intro">This is a growing collection of independently run businesses, creators, and projects whose work is worth exploring. Community Circle is separate from Nik\'s Remodeling\'s own services.</p>\n<section class="btr-section"><p class="btr-note" style="font-weight:750;letter-spacing:.06em;text-transform:uppercase">First featured connection</p><h2>Ocoee Studios</h2><p>Ocoee Studios is an independent creative studio building useful ideas, including STRUK, a project for contractors.</p><div class="btr-links"><a class="btr-link" href="https://ocoeestudios.com/" target="_blank" rel="noopener noreferrer">Visit Ocoee Studios</a><a class="btr-link" href="https://ocoeestudios.com/product/struk" target="_blank" rel="noopener noreferrer">Explore STRUK</a></div></section>\n<section class="btr-section"><h2>Creative Tools We Use</h2><p>Meet some of the tools behind our commercials, comics and social media content.</p><h3>Metricool</h3><p>Helps us publish content and track social media performance.</p><div class="btr-links"><a class="btr-link" href="https://metricool.com/" target="_blank" rel="noopener noreferrer">Explore Metricool</a></div><h3>HeyGen</h3><p>Helps us create AI-powered commercials, videos and virtual spokespeople.</p><div class="btr-links"><a class="btr-link" href="https://www.heygen.com/" target="_blank" rel="noopener noreferrer">Explore HeyGen</a></div><h3>vidIQ</h3><p>Helps us research video ideas and improve our YouTube visibility.</p><div class="btr-links"><a class="btr-link" href="https://vidiq.com/" target="_blank" rel="noopener noreferrer">Explore vidIQ</a></div></section>\n<section class="btr-section"><h2>A Circle With Room to Grow</h2><p>Additional independently owned businesses, creative projects, and community connections can be featured here as they are confirmed.</p><p class="btr-note">Featured organizations are independent of Nik\'s Remodeling. A feature is not a claim of ownership or partnership.</p></section></div></div></main>'+footer(false));</script></body></html>
