.labor-page{background:#f5f7f9;padding-bottom:50px}.labor-hero{background:#edf3f8;border-bottom:1px solid var(--line);padding:36px 0}.labor-hero h1{font-size:36px;margin:8px 0 12px;color:var(--blue2)}.labor-hero p{margin:0;max-width:650px;line-height:1.65}.labor-kicker{color:var(--blue);font-size:12px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase}.labor-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding-top:28px}.labor-category-list{display:flex;flex-direction:column;gap:5px}.labor-category-list button{border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:6px;font-weight:700;color:var(--ink);cursor:pointer}.labor-category-list button[aria-pressed=true]{background:var(--blue2);color:white}.labor-side-label{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted)}.labor-help{padding:17px 14px;border-top:1px solid var(--line);margin-top:18px;font-size:13px;line-height:1.65}.labor-help strong{display:block;color:var(--blue2)}.labor-panel{background:#fff;padding:25px;border:1px solid var(--line);border-radius:9px;min-width:0}.labor-panel h2{margin:0 0 8px;font-size:25px}.labor-panel-intro{margin:0 0 24px;color:var(--muted);line-height:1.5}.labor-room{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap}.labor-room label{font-weight:700}.labor-room input{padding:10px 12px;border:1px solid #b7c5d1;border-radius:5px;min-width:0;max-width:100%;width:250px}.labor-fixture{border:1px solid var(--line);border-radius:7px;margin:12px 0;overflow:hidden}.labor-fixture>summary{padding:17px 18px;cursor:pointer;font-weight:750;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}.labor-fixture>summary:after{content:'+';color:var(--blue);font-size:22px;font-weight:400}.labor-fixture[open]>summary:after{content:'−'}.labor-fixture[open]>summary{background:#f4f8fb;border-bottom:1px solid var(--line)}.labor-fixture-content{padding:18px}.labor-modes{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}.labor-mode{padding:9px 16px;background:#fff;border:1px solid #becdd9;border-radius:5px;color:var(--blue2);font-weight:700;cursor:pointer}.labor-mode[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}.labor-task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:13px 0;border-bottom:1px solid #edf0f3}.labor-task input{accent-color:var(--blue);width:18px;height:18px;margin:2px 0}.labor-task small{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5}.labor-task-price{text-align:right;color:var(--blue2);font-size:14px;font-weight:700}.labor-task-price small{font-weight:400}.labor-controls{display:flex;flex-wrap:wrap;align-items:center;gap:13px;margin-top:19px}.labor-controls label{font-size:13px;font-weight:700}.labor-controls input{border:1px solid #becdd9;border-radius:4px;padding:9px;width:75px;margin-left:8px}.labor-controls .btn{margin-left:auto}.labor-status{font-size:13px;line-height:1.5;margin:12px 0 0;color:var(--blue2)}.labor-review{margin-top:24px;background:#fff;padding:22px;border:1px solid var(--line);border-radius:8px}.labor-review h2{font-size:20px;margin:0 0 15px}.labor-review-row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:12px 0}.labor-review-row p{margin:5px 0;font-size:13px}.labor-review-row button{background:transparent;border:0;color:var(--blue);text-decoration:underline;padding:5px;cursor:pointer;font:inherit;font-size:13px}.labor-review-actions{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:20px}.labor-note{font-size:13px;color:var(--muted);line-height:1.5}.labor-total{font-weight:800;color:var(--blue2)}.labor-empty{color:var(--muted);font-size:14px}.labor-focus:focus-visible{outline:3px solid var(--blue);outline-offset:3px}@media(max-width:800px){.labor-layout{grid-template-columns:1fr}.labor-category-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.labor-help{display:none}.labor-panel{padding:18px}.labor-hero h1{font-size:29px}}@media(max-width:480px){.labor-fixture-content{padding:13px}.labor-modes{display:grid;grid-template-columns:1fr 1fr}.labor-mode{padding:11px 8px}.labor-task{grid-template-columns:22px minmax(0,1fr)}.labor-task-price{grid-column:2;text-align:left}.labor-controls .btn{margin-left:0;width:100%}.labor-room input{width:100%;font-size:16px}.labor-category-list button{padding:12px 8px;font-size:13px}}

.labor-long-list{padding-top:28px}.labor-section{background:white;border:1px solid var(--line);border-radius:8px;padding:22px;margin:25px 0}.labor-section>h2{font-size:27px;color:var(--blue2);margin:0 0 25px;padding-bottom:12px;border-bottom:2px solid var(--blue2)}.labor-group-heading{font-size:20px;margin:25px 0 5px;padding:14px 12px;background:#edf3f8;color:var(--blue2)}.labor-line{display:grid;grid-template-columns:minmax(0,1fr) 130px 245px;gap:18px;align-items:center;padding:16px 12px;border-bottom:1px solid var(--line)}.labor-line-copy strong{display:block;font-size:15px}.labor-line-copy small,.labor-line-price small{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px}.labor-action-label{display:block;text-transform:uppercase;letter-spacing:.8px;font-weight:700;font-size:11px;color:var(--blue);margin-bottom:5px}.labor-line-price{font-size:14px}.labor-line-controls{display:flex;align-items:center;gap:12px;justify-content:flex-end}.labor-line-controls label{font-size:12px}.labor-line-controls input{width:58px;border:1px solid #bbc9d5;padding:9px 6px;border-radius:4px;display:block;margin-top:3px}.labor-line-controls .btn{min-width:135px;font-size:13px;padding:12px}.labor-line-status{grid-column:1/-1;font-size:12px;color:var(--blue2)}.labor-line-status:empty{display:none}@media(max-width:800px){.labor-line{grid-template-columns:minmax(0,1fr) 110px}.labor-line-controls{grid-column:1/-1;justify-content:flex-start}.labor-section{padding:14px}.labor-line-controls input{font-size:16px}}@media(max-width:420px){.labor-line{grid-template-columns:1fr;gap:10px}.labor-line-price{grid-column:1}.labor-group-heading{font-size:18px}.labor-line-controls{justify-content:space-between}}

<script>
// Shared task definitions are loaded from labor-catalog.js.
document.addEventListener('DOMContentLoaded',()=>{
 document.body.innerHTML=header()+`<main class="labor-page"><section class="labor-hero"><div class="wrap"><div class="labor-kicker">Your project. Your choice.</div><h1>Installation / Labor</h1><p>Find the task you need and add it to your project. Labor only; materials extra.</p></div></section><div class="wrap labor-long-list"><div class="labor-room"><label for="labor-room">Room / area</label><input id="labor-room" placeholder="e.g. Main bathroom" autocomplete="off"></div><p class="labor-note">$150 minimum per visit. Draft and unpriced tasks are saved for a quote.</p><div id="labor-all-tasks"></div><section class="labor-review"><h2>Your selected work</h2><div id="labor-review-list"></div><div class="labor-review-actions"><span class="labor-total" id="labor-review-total"></span><a class="btn primary" href="/project-cart.html">Review Project Cart</a></div></section></div></main>`+footer();
 const make=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e},byId=id=>document.getElementById(id),money=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
 const rows=new Map();
 function renderReview(){const items=getCart().filter(x=>x.source==='labor-catalog'),list=byId('labor-review-list');list.replaceChildren();if(!items.length)list.append(make('p','No work selected yet.','labor-empty'));items.forEach(item=>{const row=make('div',undefined,'labor-review-row'),copy=make('div'),price=make('div');copy.append(make('strong',item.room+' — '+item.fixture),make('p',item.taskLabel+' · '+item.qty+' '+item.unit));price.append(make('p',typeof item.price==='number'?money(item.price*item.qty):item.draftPrice?money(item.draftPrice*item.qty)+' draft · needs review':'Price to set'));const edit=make('button','Edit'),remove=make('button','Remove');edit.type=remove.type='button';edit.onclick=()=>{const target=rows.get(item.taskId);if(!target)return;byId('labor-room').value=item.room;target.quantity.value=item.qty;target.editing=item.lineId;target.button.textContent='Save Changes';target.row.scrollIntoView({behavior:'smooth',block:'center'});target.quantity.focus({preventScroll:true})};remove.onclick=()=>{saveCart(getCart().filter(x=>x.lineId!==item.lineId));renderReview()};price.append(edit,remove);row.append(copy,price);list.append(row)});const priced=items.filter(x=>typeof x.price==='number').reduce((sum,x)=>sum+x.price*x.qty,0),pending=items.some(x=>typeof x.price!=='number');byId('labor-review-total').textContent=items.length?(priced?'Priced labor: '+money(Math.max(150,priced))+(pending?' + quote requests':''):'Labor price pending review'):'';}
 const list=byId('labor-all-tasks');
 LABOR_CATALOG.forEach(category=>{const section=make('section',undefined,'labor-section');section.append(make('h2',category.label));category.groups.forEach(group=>{section.append(make('h3',group.label,'labor-group-heading'));Object.entries(group.actions).forEach(([mode,tasks])=>tasks.forEach(task=>{const row=make('div',undefined,'labor-line'),copy=make('div',undefined,'labor-line-copy'),price=make('div',undefined,'labor-line-price');copy.append(make('span',mode,'labor-action-label'),make('strong',task.label));if(task.note)copy.append(make('small',task.note));if(task.status==='calculator'){const link=make('a','Calculate','btn primary');link.href='/calculators.html?material=flooring&labor=1';link.onclick=e=>{e.preventDefault();openMaterialCalculator(link.href+'&room='+encodeURIComponent(byId('labor-room').value));};row.append(copy,link);section.append(row);return;}
 price.append(make('strong',typeof task.price==='number'?money(task.price)+' / '+task.unit:'Price to set'));if(task.status==='draft')price.append(make('small','Draft · needs review'));const control=make('div',undefined,'labor-line-controls'),label=make('label','Qty'),quantity=make('input');quantity.type='number';quantity.min=task.unit==='hours'?'0.25':'1';quantity.step=task.unit==='hours'?'0.25':'1';quantity.value='1';quantity.setAttribute('aria-label',task.label+' quantity');label.append(quantity);const button=make('button',task.status==='approved'?'Add to Cart':'Add for Quote','btn primary');button.type='button';const status=make('div','','labor-line-status');status.setAttribute('role','status');const state={row,quantity,button,editing:null};rows.set(task.id,state);button.onclick=()=>{const room=byId('labor-room').value.trim(),qty=Number(quantity.value);if(!room){status.textContent='Enter the room / area above.';byId('labor-room').focus();return;}if(!Number.isFinite(qty)||qty<=0||(task.unit!=='hours'&&!Number.isInteger(qty))){status.textContent='Enter a valid quantity.';quantity.focus();return;}let cart=getCart();if(state.editing)cart=cart.filter(x=>x.lineId!==state.editing);const lineId=room+'|'+task.id,entry={source:'labor-catalog',lineId,categoryId:category.id,groupId:group.id,fixture:group.label,room,mode,taskId:task.id,taskLabel:task.label,unit:task.unit,name:room+': '+task.label,type:task.status==='approved'?'Labor':'Service',qty,...(task.status==='approved'?{price:task.price}:{}),...(task.status==='draft'?{draftPrice:task.price}:{})};const existing=cart.findIndex(x=>x.source==='labor-catalog'&&x.lineId===lineId);if(existing>=0)cart[existing]=entry;else cart.push(entry);saveCart(cart);state.editing=null;button.textContent=task.status==='approved'?'Add to Cart':'Add for Quote';status.textContent=task.status==='approved'?'Added to cart.':'Added for a labor quote.';renderReview()};control.append(label,button);row.append(copy,price,control,status);section.append(row);}));});list.append(section);});renderReview();updateCartCount();initNavMenus();
});
</script>
