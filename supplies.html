<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browse finishing supplies and project materials from Nik's Remodeling."><title>Supplies | Nik's Remodeling</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/store.css"><style>.supply-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:24px 0}.supply-links a{display:block;padding:24px;background:#fff;border:1px solid #dbe2eb;border-radius:10px;text-decoration:none;color:inherit}.supply-links a:hover,.supply-links a:focus-visible{border-color:#195b96;box-shadow:0 3px 12px #0001}.supply-links strong{display:block;margin-bottom:8px}</style></head><body data-page="shopping-home"><script src="/app.js"></script><script src="/room-projects.js?v=projects-continue-20261029c"></script><script src="/shopping-flow.js?v=real-supplies-20261028"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.body.innerHTML=header()+'<main class="wrap section"><p><a href="/shopping.html">← Shopping</a></p><h1>Supplies</h1><p>Choose supplies and materials for your job. Tools are listed separately in Shopping.</p><div class="supply-links"><a href="/material-paint-finishes.html"><strong>Paint & Finishing Supplies</strong>Paint, primer and finishes</a><a href="/material-trim-molding.html"><strong>Trim & Molding</strong>Baseboards, casing and related trim</a><a href="/material-flooring.html"><strong>Flooring Supplies & Materials</strong>Flooring, underlayment and accessories</a><a href="/material-drywall.html"><strong>Drywall Materials</strong>Panels and related supplies</a><a href="/materials.html"><strong>All Building Materials</strong>Browse the complete materials categories</a></div><p>Product stock and pricing must be confirmed before sale. Installation supplies are handled with the labor quote, without charging them twice.</p><section class="panel" style="padding:20px;margin-top:24px"><h2>Approved Supply Price Reference</h2><p>These prices already include the 35% markup. Reference prices are not confirmed in-stock items or checkout offers. Tools are not automatically charged to customer projects.</p><div id="approved-supply-table" aria-live="polite">Loading approved supply prices…</div></section></main>'+footer();updateCartCount();initNavMenus();fetch('/data/approved-supply-prices.json').then(response=>{if(!response.ok)throw Error('Unavailable');return response.json()}).then(data=>{if(data.pricesIncludeMarkup!==true||!Array.isArray(data.items))throw Error('Invalid');const mount=document.getElementById('approved-supply-table');const table=document.createElement('table');table.style.cssText='width:100%;border-collapse:collapse';const caption=document.createElement('caption');caption.textContent='Approved supplies and tools, alphabetically';caption.style.cssText='text-align:left;margin-bottom:10px';table.append(caption);const head=document.createElement('thead');head.innerHTML='<tr><th scope="col" style="text-align:left;padding:8px">Item</th><th scope="col" style="text-align:right;padding:8px">Approved price</th></tr>';table.append(head);const tbody=document.createElement('tbody');for(const item of data.items.slice().sort((a,b)=>a.name.localeCompare(b.name))){const tr=document.createElement('tr');tr.style.borderTop='1px solid #dce4e9';const name=document.createElement('td');name.textContent=item.name;name.style.padding='9px 8px';const price=document.createElement('td');price.textContent=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(item.price);price.style.cssText='padding:9px 8px;text-align:right;white-space:nowrap';tr.append(name,price);tbody.append(tr)}table.append(tbody);mount.replaceChildren(table)}).catch(()=>{document.getElementById('approved-supply-table').textContent='Approved supply prices are temporarily unavailable.'});});</script></body></html>
